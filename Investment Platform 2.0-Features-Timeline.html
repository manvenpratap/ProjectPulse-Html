.scheduler-grid-day-cell { padding: 10px; text-align: center; vertical-align: top; min-height: 90px; width: 108px; cursor: default; transition: background var(--tr-base), border-color var(--tr-base); }
.scheduler-task-chip { font-size: 10px; padding: 4px 8px; border-radius: var(--radius-sm); background: var(--color-surface-2); border: 1px solid var(--color-divider); width: 100%; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: transform var(--tr-base), border-color var(--tr-base), box-shadow var(--tr-base); box-shadow: rgba(255, 255, 255, 0.05) 0px 1px 0px inset; }

.scheduler-task-chip.highlighted { border-color: var(--color-primary) !important; background: var(--color-primary-highlight) !important; }

.scheduler-tab-btn { flex: 1 1 0%; padding: 8px 12px; border-width: medium; border-style: none; border-color: currentcolor; border-image: initial; background: transparent; border-radius: var(--radius-sm); color: var(--color-text-muted); font-size: 11px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all var(--tr-smooth); }

.scheduler-info-card { background: var(--color-surface-2); border-radius: var(--radius-sm); padding: 10px; border-top: 1px solid var(--color-divider); border-bottom: 1px solid var(--color-divider); border-right: 1px solid var(--color-divider); display: flex; flex-direction: column; gap: 6px; transition: transform var(--tr-base), box-shadow var(--tr-base); }

.matrix-cell { position: relative; text-align: center; background: var(--color-surface-1); cursor: pointer; padding: 12px !important; border: 1px solid var(--color-border-faint) !important; transition: 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important; }

    :root {
      --color-bg: #ffffff;
      --color-surface: #ffffff;
      --color-surface-2: #f8f7f4;
      --color-border: #e8e4dc;
      --color-divider: #f0ede8;
      --color-text: #1c1917;
      --color-text-muted: #6b6560;
      --color-text-faint: #a8a29e;
      --color-primary: #6366f1;
      --color-primary-rgb: 99, 102, 241;
      --color-border-faint: rgba(0, 0, 0, 0.04);
      --red: #ef4444;
      --green: #10b981;
      --amber: #f59e0b;
      --blue: #3b82f6;
      --font-body: 'Plus Jakarta Sans', 'Outfit', sans-serif;
      --sl-left-w: 220px;
    }
    body.dark-theme {
      --color-bg: #11100e;
      --color-surface: #1c1917;
      --color-surface-2: #262220;
      --color-border: #2e2a28;
      --color-divider: #3a3532;
      --color-text: #f5f5f4;
      --color-text-muted: #d6d3d1;
      --color-text-faint: #78716c;
      --color-primary: #818cf8;
      --color-primary-rgb: 129, 140, 248;
      --color-border-faint: rgba(255, 255, 255, 0.05);
      --red: #ef4444;
      --green: #10b981;
      --amber: #f59e0b;
      --blue: #3b82f6;
    }
    body {
      margin: 0;
      padding: 16px;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .export-header {
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 16px;
    }
    .export-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .export-meta {
      font-size: 11px;
      color: var(--color-text-muted);
    }
    .controls-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .search-input {
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      height: 32px;
      box-sizing: border-box;
      width: 180px;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--color-primary);
    }
    .btn-group {
      display: flex;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--color-surface);
    }
    .btn {
      background: transparent;
      border: none;
      color: var(--color-text-muted);
      font-size: 12px;
      padding: 6px 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-body);
      transition: background 0.15s, color 0.15s;
    }
    .btn.active {
      background: var(--color-primary);
      color: #ffffff;
    }
    .btn:hover:not(.active) {
      background: var(--color-surface-2);
      color: var(--color-text);
    }
    .gantt-outer {
      display: flex;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--color-surface);
      flex: 1;
      height: calc(100vh - 165px);
      position: relative;
    }
    .gantt-left {
      width: 280px;
      flex-shrink: 0;
      overflow-y: hidden;
      background: var(--color-surface);
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    .gantt-splitter {
      width: 4px;
      background: var(--color-divider);
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .gantt-splitter:hover, .gantt-splitter.dragging {
      background: var(--color-primary);
    }
    .gantt-right {
      flex: 1;
      overflow: auto;
      background: var(--color-surface-2);
      position: relative;
    }
    .gl-head {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-weight: 800;
      font-size: 11px;
      color: var(--color-text-faint);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-bottom: 2px solid var(--color-border);
      background: var(--color-surface-2);
      flex-shrink: 0;
      box-sizing: border-box;
    }
    .gl-row {
      height: 32px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--color-divider);
      font-size: 12px;
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .gl-row.feat-row {
      height: 48px;
      padding: 0 12px 0 0;
    }
    .gantt-tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      font-size: 11px;
      min-width: 200px;
      max-width: 280px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      display: block;
      color: var(--color-text);
      font-family: var(--font-body);
    }
    
    /* ── Swimlane View CSS ── */
    .swimlane-outer {
      display: none !important;
      flex-direction: row !important;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--color-surface);
      flex: 1;
      height: calc(100vh - 165px) !important;
      position: relative;
    }
    /* ── KPI bento strip ── */
    .sh-kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .sh-kpi-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 10px 12px;
      position: relative;
      overflow: hidden;
    }
    .sh-kpi-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .sh-kpi-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--color-text-muted);
    }
    .sh-kpi-icon {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sh-kpi-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--color-text);
      margin: 4px 0 2px;
      line-height: 1;
    }
    .sh-kpi-sub {
      font-size: 8.5px;
      font-weight: 600;
      color: var(--color-text-faint);
    }
    /* ── Release Legend strip ── */
    .release-legend-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      flex-shrink: 0;

    .legend-title {

      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-text-faint);
      margin-right: 4px;

    .legend-pill {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      display: inline-flex;

      text-transform: uppercase;
      letter-spacing: 0.5px;

    .sl-left-lanes-container {
      flex: 1;
      overflow-y: hidden;
    }
    .sl-right-lanes-container {
      flex: 1;
    }
    .sl-lane-left-group {
      display: flex;
      flex-direction: column;

    .sl-lane-right-group {

  </style>
</head>
<body>
  <div class="export-header">
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="logo-mark" style="width:36px; height:36px; background:var(--color-primary); border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <i data-lucide="zap" style="color:#ffffff; width:18px; height:18px;"></i>
      </div>
      <div>
        <div class="export-title" id="export-title-el" style="font-size:18px; font-weight:800; letter-spacing:-0.02em; line-height:1.2;">Project Timeline</div>
        <div class="export-meta" style="font-size:11px; color:var(--color-text-muted); margin-top:2px;">Exported on 7/11/2026, 12:57:11 AM</div>
      </div>
    </div>
    <div class="controls-wrap">
      <input type="text" class="search-input" id="search-input" placeholder="Search..." />
      <div class="btn-group" id="view-mode-group">
        <button class="btn active" id="view-timeline-btn" onclick="setViewMode('timeline')">&#9776; Timeline</button>
        <button class="btn" id="view-swimlane-btn" onclick="setViewMode('swimlane')">&#9638; Swimlane</button>
      </div>
      <div class="btn-group">
        <button class="btn" id="zoom-day-btn" onclick="setZoom('day')">Day</button>
        <button class="btn active" id="zoom-week-btn" onclick="setZoom('week')">Week</button>
        <button class="btn" id="zoom-month-btn" onclick="setZoom('month')">Month</button>
      </div>
      <div class="btn-group" id="toggles-group" style="display: none;">
        <button class="btn active" id="toggle-actuals-btn" onclick="toggleActuals()">Actuals</button>
        <button class="btn active" id="toggle-deps-btn" onclick="toggleDeps()">Deps</button>
        <button class="btn" id="toggle-mc-btn" onclick="toggleMC()">MC</button>
      </div>
      <button class="btn" id="theme-toggle-btn" onclick="toggleTheme()" style="border: 1px solid var(--color-border); border-radius: 8px; font-weight: 600; padding: 6px 12px; background: var(--color-surface); color: var(--color-text-muted);">🌙 Dark Mode</button>
      <button class="btn" id="copy-image-btn" onclick="copyViewImageToClipboard()" style="border: 1px solid var(--color-border); border-radius: 8px; font-weight: 600; padding: 6px 12px; background: var(--color-surface); color: var(--color-text-muted); display: flex; align-items: center; gap: 6px;"><i data-lucide="copy" style="width:14px; height:14px;"></i> Copy Image</button>
    </div>
  </div>
  <div class="sh-kpi-grid" id="export-kpi-grid"></div>
  <div class="release-legend-strip" id="export-release-legend"></div>
  <div class="gantt-outer" id="export-gantt-outer">
    <div class="gantt-left" id="export-gantt-left"></div>
    <div class="gantt-splitter" id="export-gantt-splitter"></div>
    <div class="gantt-right" id="export-gantt-right">
      <canvas id="export-gantt-canvas"></canvas>
    </div>
  </div>
  <div class="swimlane-outer" id="export-swimlane-outer"></div>
  <div class="gantt-tooltip" id="export-gantt-tooltip"></div>

  <script>
    const DATA = {"isFeat":true,"projectName":"Investment Platform 2.0","releases":[{"id":"rel-1","name":"v1.0.0","date":"2026-07-30","status":"Active"},{"id":"rel-2","name":"v1.1.0","date":"2026-08-24","status":"Planned"},{"id":"rel-3","name":"v2.0-Beta","date":"2026-10-08","status":"Planned"}],"theme":"paper","colorMode":"default","showGanttActuals":true,"items":[{"id":"feat-0","name":"Core Infrastructure","release":"v1.0.0","category":"","progress":0,"overdue":0,"startDate":null,"dueDate":null,"screensCount":0,"screensDone":0},{"id":"feat-1","name":"User Management","release":"v1.0.0","category":"","progress":33,"overdue":0,"startDate":"2026-06-28","dueDate":"2026-07-21","screensCount":3,"screensDone":1},{"id":"feat-2","name":"Market Intelligence","release":"v1.1.0","category":"","progress":0,"overdue":0,"startDate":null,"dueDate":null,"screensCount":0,"screensDone":0}]};
    let currentZoom = 'week';
    let currentViewMode = 'timeline';
    let searchQuery = '';
    const items = DATA.items;
    const isFeat = DATA.isFeat;

    let showActuals = true;
    let showDeps = true;
    let showMC = false;
    let isDarkTheme = false;

    const FEAT_PALETTE = ['#6366f1','#8b5cf6','#0ea5e9','#10b981','#f59e0b','#ef4444','#ec4899','#06b6d4'];
    const RELEASE_STATUS_COLORS = { Released: '#10b981', Active: '#3b82f6', Planned: '#f59e0b' };
    const ST_COLORS = { 'Not Started': '#94a3b8', 'In Progress': '#3b82f6', 'On Hold': '#f59e0b', 'Under Review': '#8b5cf6', Completed: '#22c55e', Cancelled: '#ef4444' };

    function $id(id) { return document.getElementById(id); }
    function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function fmtDate(dStr) {
      if (!dStr) return '';
      const d = new Date(dStr + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }
    function fmtDateFull(dStr) {
      if (!dStr) return '';
      const d = new Date(dStr + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }
    function laneColorForIdx(idx) { return FEAT_PALETTE[idx % FEAT_PALETTE.length]; }
    function getGroupKey(t) { return isFeat ? (t.category || 'Uncategorized') : (t.moduleType || 'General'); }

    function updateMetricsAndLegend() {
      const q = searchQuery;
      const filtered = items.filter(t => {
        const matchesSearch = t.name.toLowerCase().includes(q) || (t.release || '').toLowerCase().includes(q) || (t.category || '').toLowerCase().includes(q);
        if (!matchesSearch) return false;
        if (isFeat) return true;
        if (showMC) {
          return t.startDate === t.dueDate || t.category === 'Milestone';
        }
        return true;
      });

      const grid = $id('export-kpi-grid');
      const legend = $id('export-release-legend');
      if (!grid || !legend) return;

      if (isFeat) {
        const tot = filtered.length;
        const avgM = tot ? Math.round(filtered.reduce((s, t) => s + (t.progress || 0), 0) / tot) : 0;
        const overdue = filtered.filter(t => t.overdue > 0).length;
        const screens = filtered.reduce((s, t) => s + (t.screensCount || 0), 0);

        grid.innerHTML = `
          <div class="sh-kpi-card">
            <div class="sh-kpi-row">
              <span class="sh-kpi-label">Total Features</span>
              <div class="sh-kpi-icon" style="background:rgba(99,102,241,0.1);color:var(--color-primary);"><i data-lucide="layers" style="width:12px;height:12px;"></i></div>
            </div>
            <div class="sh-kpi-value">${tot}</div>
            <div class="sh-kpi-sub">Active features in view</div>
          </div>
          <div class="sh-kpi-card">
            <div class="sh-kpi-row">
              <span class="sh-kpi-label">Avg Maturity</span>
              <div class="sh-kpi-icon" style="background:rgba(16,185,129,0.1);color:var(--green);"><i data-lucide="activity" style="width:12px;height:12px;"></i></div>
            </div>
            <div class="sh-kpi-value">${avgM}%</div>
            <div class="sh-kpi-sub">Weighted progression</div>
          </div>
          <div class="sh-kpi-card">
            <div class="sh-kpi-row">
              <span class="sh-kpi-label">At Risk</span>
              <div class="sh-kpi-icon" style="background:rgba(239,68,68,0.1);color:var(--red);"><i data-lucide="alert-triangle" style="width:12px;height:12px;"></i></div>
            </div>
            <div class="sh-kpi-value" style="color:var(--red);">${overdue}</div>
            <div class="sh-kpi-sub">Features overdue</div>
          </div>
          <div class="sh-kpi-card">
            <div class="sh-kpi-row">
              <span class="sh-kpi-label">Screens Mapped</span>
              <div class="sh-kpi-icon" style="background:rgba(245,158,11,0.1);color:var(--amber);"><i data-lucide="monitor" style="width:12px;height:12px;"></i></div>
            </div>
            <div class="sh-kpi-value">${screens}</div>
            <div class="sh-kpi-sub">Total mapped mockups</div>
          </div>
        `;
      } else {
        const tot = filtered.length;
        const avgP = tot ? Math.round(filtered.reduce((s, t) => s + (t.progress || 0), 0) / tot) : 0;
        const comp = filtered.filter(t => t.status === 'Completed').length;
        const delayed = filtered.filter(t => t.status !== 'Completed' && t.dueDate && new Date(t.dueDate) < new Date()).length;

        grid.innerHTML = `
          <div class="sh-kpi-card">
            <div class="sh-kpi-row">
              <span class="sh-kpi-label">Total Tasks</span>
              <div class="sh-kpi-icon" style="background:rgba(99,102,241,0.1);color:var(--color-primary);"><i data-lucide="check-square" style="width:12px;height:12px;"></i></div>
            </div>
            <div class="sh-kpi-value">${tot}</div>
            <div class="sh-kpi-sub">Total tasks in scope</div>
          </div>
          <div class="sh-kpi-card">
            <div class="sh-kpi-row">
              <span class="sh-kpi-label">Completed</span>
              <div class="sh-kpi-icon" style="background:rgba(16,185,129,0.1);color:var(--green);"><i data-lucide="check" style="width:12px;height:12px;"></i></div>
            </div>
            <div class="sh-kpi-value">${comp}</div>
            <div class="sh-kpi-sub">Tasks fully done</div>
          </div>
          <div class="sh-kpi-card">
            <div class="sh-kpi-row">
              <span class="sh-kpi-label">Progress</span>
              <div class="sh-kpi-icon" style="background:rgba(59,130,246,0.1);color:var(--blue);"><i data-lucide="trending-up" style="width:12px;height:12px;"></i></div>
            </div>
            <div class="sh-kpi-value">${avgP}%</div>
            <div class="sh-kpi-sub">Average completion</div>
          </div>
          <div class="sh-kpi-card">
            <div class="sh-kpi-row">
              <span class="sh-kpi-label">Overdue</span>
              <div class="sh-kpi-icon" style="background:rgba(239,68,68,0.1);color:var(--red);"><i data-lucide="clock" style="width:12px;height:12px;"></i></div>
            </div>
            <div class="sh-kpi-value" style="color:var(--red);">${delayed}</div>
            <div class="sh-kpi-sub">Past due date tasks</div>
          </div>
        `;
      }

      // Populate Release Legend
      let legendHtml = '<span class="legend-title">Releases:</span>';
      (DATA.releases || []).forEach(r => {
        const rc = RELEASE_STATUS_COLORS[r.status] || '#94a3b8';
        legendHtml += `
          <div class="legend-pill" style="background:${rc}12; border-color:${rc}33; color:${rc}">
            <span style="width:6px; height:6px; border-radius:50%; background:${rc};"></span>
            ${esc(r.name)} (${esc(r.status)})
          </div>
        `;
      });
      legend.innerHTML = legendHtml;

      if (window.lucide) lucide.createIcons();
    }

    if (!isFeat) {
      $id('toggles-group').style.display = 'flex';
    }

    function getThemeColors() {
      if (isDarkTheme) {
        return {
          bg: '#1c1917',
          bg2: '#262220',
          border: '#2e2a28',
          divider: '#3a3532',
          text: '#f5f5f4',
          muted: '#d6d3d1',
          faint: '#78716c'
        };
      } else {
        return {
          bg: '#ffffff',
          bg2: '#f8f7f4',
          border: '#e8e4dc',
          divider: '#f0ede8',
          text: '#1c1917',
          muted: '#6b6560',
          faint: '#a8a29e'
        };
      }
    }

    window.toggleActuals = function() {
      showActuals = !showActuals;
      $id('toggle-actuals-btn').classList.toggle('active', showActuals);
      if (currentViewMode === 'swimlane') renderSwimlane();
      else renderGantt();
    };

    window.toggleDeps = function() {
      showDeps = !showDeps;
      $id('toggle-deps-btn').classList.toggle('active', showDeps);
      if (currentViewMode === 'swimlane') renderSwimlane();
      else renderGantt();
    };

    window.toggleMC = function() {
      showMC = !showMC;
      $id('toggle-mc-btn').classList.toggle('active', showMC);
      if (currentViewMode === 'swimlane') renderSwimlane();
      else renderGantt();
    };

    window.toggleTheme = function() {
      isDarkTheme = !isDarkTheme;
      document.body.classList.toggle('dark-theme', isDarkTheme);
      $id('theme-toggle-btn').innerHTML = isDarkTheme ? '☀️ Light Mode' : '🌙 Dark Mode';
      if (currentViewMode === 'swimlane') renderSwimlane();
      else renderGantt();
    };

    $id('export-title-el').textContent = DATA.projectName + ' - ' + (isFeat ? 'Features Timeline' : 'Tasks Timeline');
    document.title = DATA.projectName + ' - ' + (isFeat ? 'Features Timeline' : 'Tasks Timeline');

    window.setViewMode = function(mode) {
      currentViewMode = mode;
      $id('view-timeline-btn').classList.toggle('active', mode === 'timeline');
      $id('view-swimlane-btn').classList.toggle('active', mode === 'swimlane');
      const ganttOuter = $id('export-gantt-outer');
      const swimOuter = $id('export-swimlane-outer');
      if (mode === 'swimlane') {
        ganttOuter.classList.add('sl-hidden');
        swimOuter.classList.add('active');
        renderSwimlane();
      } else {
        ganttOuter.classList.remove('sl-hidden');
        swimOuter.classList.remove('active');
        renderGantt();
      }
    };

    const splitter = $id('export-gantt-splitter');
    const leftPanel = $id('export-gantt-left');
    let isDragging = false;

    splitter.addEventListener('mousedown', (e) => {
      isDragging = true;
      splitter.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const newWidth = Math.max(150, Math.min(600, e.clientX));
      leftPanel.style.width = newWidth + 'px';
    });

    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        splitter.classList.remove('dragging');
        document.body.style.cursor = '';
        renderGantt();
      }
    });

    window.setZoom = function(z) {
      currentZoom = z;
      [$id('zoom-day-btn'), $id('zoom-week-btn'), $id('zoom-month-btn')].forEach(b => b && b.classList.remove('active'));
      $id('zoom-' + z + '-btn').classList.add('active');
      if (currentViewMode === 'swimlane') renderSwimlane();
      else renderGantt();
    };

    const searchInput = $id('search-input');
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase();
      if (currentViewMode === 'swimlane') renderSwimlane();
      else renderGantt();
    });

    const cvs = $id('export-gantt-canvas');
    const tooltip = $id('export-gantt-tooltip');
    let hitAreas = [];

    cvs.addEventListener('mousemove', (e) => {
      const rect = cvs.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      let hit = null;
      hitAreas.forEach(h => {
        if (mouseX >= h.x && mouseX <= h.x2 && mouseY >= h.y && mouseY <= h.y2) {
          hit = h;
        }
      });
      cvs.style.cursor = hit ? 'pointer' : 'default';

      document.querySelectorAll('.gl-row').forEach((r, idx) => {
        r.style.background = (hit && hit.idx === idx) ? 'var(--color-surface-2)' : (idx % 2 === 1 ? 'rgba(0,0,0,0.013)' : 'transparent');
      });

      if (hit) {
        const t = hit.item;
        tooltip.style.opacity = '1';
        tooltip.style.transform = 'translateY(0)';
        let tx = e.clientX + 15;
        let ty = e.clientY + 15;
        if (tx + 220 > window.innerWidth) tx = e.clientX - 235;
        if (ty + 130 > window.innerHeight) ty = e.clientY - 145;
        tooltip.style.left = tx + 'px';
        tooltip.style.top = ty + 'px';

        if (isFeat) {
          tooltip.innerHTML = `
            <div style="font-weight:700;margin-bottom:8px;font-size:12px">${esc(t.name)}</div>
            <div style="display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:10px;color:var(--color-text-muted)">
              <span>Release:</span> <span style="color:var(--color-text);font-weight:600">${esc(t.release || 'Unassigned')}</span>
              ${t.category ? `<span>Category:</span> <span style="color:#7c3aed;font-weight:600">${esc(t.category)}</span>` : ''}
              <span>Planned:</span> <span style="color:var(--color-text);font-weight:600">${fmtDate(t.startDate)} &rarr; ${fmtDate(t.dueDate)}</span>
              <span>Progress:</span> <span style="color:var(--color-text);font-weight:600">${t.progress || 0}%</span>
              <span>Screens:</span> <span style="color:var(--color-text);font-weight:600">${t.screensDone} / ${t.screensCount} completed</span>
            </div>
          `;
        } else {
          tooltip.innerHTML = `
            <div style="font-weight:700;margin-bottom:8px;font-size:12px">${esc(t.name)}</div>
            <div style="display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:10px;color:var(--color-text-muted)">
              <span>Status:</span> <span style="color:var(--color-text);font-weight:600">${esc(t.status)}</span>
              <span>Assignee:</span> <span style="color:var(--color-text);font-weight:600">${esc(t.assignee)}</span>
              <span>Planned:</span> <span style="color:var(--color-text);font-weight:600">${fmtDate(t.startDate)} &rarr; ${fmtDate(t.dueDate)}</span>
              <span>Progress:</span> <span style="color:var(--color-text);font-weight:600">${t.progress || 0}%</span>
            </div>
          `;
        }
      } else {
        tooltip.style.opacity = '0';
        tooltip.style.transform = 'translateY(8px)';
      }
    });

    cvs.addEventListener('mouseleave', () => {
      tooltip.style.opacity = '0';
      tooltip.style.transform = 'translateY(8px)';
    });

    function renderGantt() {
      updateMetricsAndLegend();
      const filtered = items.filter(t => {
        const matchesSearch = t.name.toLowerCase().includes(searchQuery) || (t.release || '').toLowerCase().includes(searchQuery) || (t.category || '').toLowerCase().includes(searchQuery);
        if (!matchesSearch) return false;
        if (isFeat) return true;
        if (showMC) {
          return t.startDate === t.dueDate || t.category === 'Milestone';
        }
        return true;
      });

      leftPanel.innerHTML = '';
      const lh = document.createElement('div');
      lh.className = 'gl-head';
      lh.innerHTML = isFeat ? 'Feature / Release' : 'Task';
      leftPanel.appendChild(lh);


      filtered.forEach((t, i) => {
        const r = document.createElement('div');
        r.className = 'gl-row';
        r.onmouseenter = () => r.style.background = 'var(--color-surface-2)';
        r.onmouseleave = () => r.style.background = i % 2 === 1 ? 'rgba(0,0,0,0.013)' : 'transparent';
        if (i % 2 === 1) r.style.background = 'rgba(0,0,0,0.013)';

        if (isFeat) {
          r.className += ' feat-row';
          const bc = t.overdue > 0 ? '#ef4444' : FEAT_PALETTE[i % FEAT_PALETTE.length];
          const stripe = document.createElement('div');
          stripe.style.cssText = `width:3px;height:100%;background:${bc};flex-shrink:0;border-radius:0 2px 2px 0;margin-right:10px;opacity:0.8;`;
          r.appendChild(stripe);

          const info = document.createElement('div');
          info.style.cssText = 'flex:1;min-width:0;overflow:hidden;';

          const nameEl = document.createElement('div');
          nameEl.className = 'export-item-name';
          nameEl.style.cssText = 'font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;';
          nameEl.textContent = t.name;

          const meta = document.createElement('div');
          meta.style.cssText = 'display:flex;align-items:center;gap:5px;margin-top:3px;';

          if (t.release) {
            const relObj = (DATA.releases || []).find(rel => rel.name === t.release);
            const rc = relObj ? (RELEASE_STATUS_COLORS[relObj.status] || '#94a3b8') : '#94a3b8';
            const relBadge = document.createElement('span');
            relBadge.style.cssText = `font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;background:${rc}18;border:1px solid ${rc}55;color:${rc};white-space:nowrap;max-width:100px;overflow:hidden;text-overflow:ellipsis;`;
            relBadge.textContent = t.release;
            meta.appendChild(relBadge);
          }

          if (t.category) {
            const catBadge = document.createElement('span');
            catBadge.style.cssText = `font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;background:rgba(124,58,237,0.08);border:1px solid rgba(124,58,237,0.2);color:#7c3aed;white-space:nowrap;max-width:100px;overflow:hidden;text-overflow:ellipsis;`;
            catBadge.textContent = '# ' + t.category;
            meta.appendChild(catBadge);
          }

          const barContainer = document.createElement('div');
          barContainer.style.cssText = 'display:inline-flex;align-items:center;gap:4px;';
          const barOuter = document.createElement('div');
          barOuter.style.cssText = `width:40px;height:4px;background:var(--color-divider);border-radius:2px;overflow:hidden;position:relative;`;
          const barInner = document.createElement('div');
          barInner.style.cssText = `position:absolute;left:0;top:0;height:100%;width:${t.progress || 0}%;background:${bc};`;
          barOuter.appendChild(barInner);
          barContainer.appendChild(barOuter);
          meta.appendChild(barContainer);

          const progSpan = document.createElement('span');
          progSpan.style.cssText = `font-size:9px;font-weight:700;color:${bc};opacity:0.85;`;
          progSpan.textContent = t.progress + '%';
          meta.appendChild(progSpan);

          if (t.overdue > 0) {
            const risk = document.createElement('span');
            risk.style.cssText = 'font-size:9px;color:#ef4444;font-weight:700;';
            risk.textContent = '⚠ Risk';
            meta.appendChild(risk);
          }

          info.appendChild(nameEl);
          info.appendChild(meta);
          r.appendChild(info);
        } else {
          let nameHtml = esc(t.name);
          const modTag = t.moduleType ? `<span style="opacity:0.5;font-size:9px;margin-right:6px;font-family:monospace;font-weight:700;text-transform:uppercase;color:var(--color-primary)">${t.moduleType}</span>` : '';
          const isMS = t.startDate === t.dueDate || t.category === 'Milestone';
          if (isMS) {
            nameHtml = `<span style="color:var(--color-primary);margin-right:4px">💎</span>${nameHtml}`;
          } else {
            nameHtml = modTag + nameHtml;
          }
          r.innerHTML = `<span class="export-item-name" style="overflow:hidden;text-overflow:ellipsis;flex:1;display:flex;align-items:center">${nameHtml}</span>`;
        }

        leftPanel.appendChild(r);
      });

      if (filtered.length === 0) {
        cvs.width = 0;
        cvs.height = 0;
        return;
      }

      let allDates = [];
      filtered.forEach(t => {
        if (t.startDate) allDates.push(new Date(t.startDate));
        if (t.dueDate) allDates.push(new Date(t.dueDate));
      });
      DATA.releases.forEach(r => { if (r.date) allDates.push(new Date(r.date)); });
      if (allDates.length === 0) {
        allDates = [new Date(), new Date(Date.now() + 30 * 864e5)];
      }

      let minDate = new Date(Math.min(...allDates));
      let maxDate = new Date(Math.max(...allDates));
      minDate.setDate(minDate.getDate() - (isFeat ? 5 : 3));
      maxDate.setDate(maxDate.getDate() + (isFeat ? 10 : 7));

      const ROW_H = isFeat ? 48 : 32;
      const HEAD_H = isFeat ? 56 : 48;
      const PAD_L = 4;
      const BAR_H = isFeat ? 22 : 16;
      const dayW = currentZoom === 'day' ? (isFeat ? 30 : 28) : currentZoom === 'week' ? (isFeat ? 14 : 12) : 4;
      const totalDays = Math.ceil((maxDate - minDate) / 864e5);

      const W = totalDays * dayW + PAD_L * 2;
      const H = HEAD_H + filtered.length * ROW_H;

      const dpr = window.devicePixelRatio || 1;
      cvs.style.width = W + 'px';
      cvs.style.height = H + 'px';
      cvs.width = W * dpr;
      cvs.height = H * dpr;

      const ctx = cvs.getContext('2d');
      ctx.scale(dpr, dpr);

      const colors = getThemeColors();
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, W, H);

      // Shaded release backgrounds
      const sortedRels = (DATA.releases || [])
        .filter(r => r.date)
        .map(r => ({ ...r, parsedDate: new Date(r.date + 'T00:00:00') }))
        .sort((a, b) => a.parsedDate - b.parsedDate);
      let lastX = 0;
      sortedRels.forEach(rel => {
        const rd = new Date(rel.date); rd.setHours(0,0,0,0);
        let rx = PAD_L + Math.floor((rd - minDate) / 864e5) * dayW;
        if (rx > W) rx = W;
        if (rx > lastX) {
          const baseColor = RELEASE_STATUS_COLORS[rel.status] || '#94a3b8';
          let rgbaColor = 'rgba(148, 163, 184, 0.05)';
          if (baseColor.startsWith('#')) {
            const r = parseInt(baseColor.slice(1, 3), 16);
            const g = parseInt(baseColor.slice(3, 5), 16);
            const b = parseInt(baseColor.slice(5, 7), 16);
            rgbaColor = `rgba(${r}, ${g}, ${b}, 0.05)`;
          }
          ctx.fillStyle = rgbaColor;
          ctx.fillRect(lastX, HEAD_H, rx - lastX, H - HEAD_H);
        }
        lastX = Math.max(0, rx);
      });

      hitAreas = [];

      ctx.fillStyle = colors.bg2;
      ctx.fillRect(0, 0, W, HEAD_H);
      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1;

      for (let d = 0; d < totalDays; d++) {
        const dt = new Date(minDate.getTime() + d * 864e5);
        const x = PAD_L + d * dayW;

        if (dt.getDay() === 1 || currentZoom === 'day') {
          ctx.strokeStyle = colors.divider;
          ctx.beginPath();
          ctx.moveTo(x, HEAD_H);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        if (dt.getDay() === 0 || dt.getDay() === 6) {
          ctx.fillStyle = isDarkTheme ? 'rgba(255,255,255,0.015)' : 'rgba(0,0,0,0.02)';
          ctx.fillRect(x, HEAD_H, dayW, H - HEAD_H);
        }

        if (currentZoom === 'day') {
          ctx.fillStyle = colors.faint;
          ctx.font = '9px var(--font-body)';
          ctx.textAlign = 'center';
          ctx.fillText(dt.getDate(), x + dayW / 2, HEAD_H - (isFeat ? 8 : 4));
          if (dt.getDate() === 1 || d === 0) {
            ctx.fillStyle = colors.muted;
            ctx.font = 'bold 9px var(--font-body)';
            ctx.fillText(dt.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' }), x + dayW / 2, HEAD_H - (isFeat ? 24 : 16));
          }
        } else if (currentZoom === 'week' && dt.getDay() === 1) {
          ctx.fillStyle = colors.faint;
          ctx.font = '9px var(--font-body)';
          ctx.textAlign = 'left';
          ctx.fillText(dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }), x + 2, HEAD_H - 4);
        } else if (currentZoom === 'month' && dt.getDate() === 1) {
          ctx.fillStyle = colors.muted;
          ctx.font = 'bold 9px var(--font-body)';
          ctx.textAlign = 'left';
          ctx.fillText(dt.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' }), x + 2, HEAD_H - 4);
        }
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      if (today >= minDate && today <= maxDate) {
        const tx = PAD_L + Math.floor((today - minDate) / 864e5) * dayW;
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(tx, HEAD_H);
        ctx.lineTo(tx, H);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 8px var(--font-body)';
        ctx.textAlign = 'left';
        ctx.fillText('Today', tx + 2, HEAD_H + 10);
      }

      DATA.releases.forEach(r => {
        if (!r.date) return;
        const rd = new Date(r.date); rd.setHours(0, 0, 0, 0);
        if (rd >= minDate && rd <= maxDate) {
          const rx = PAD_L + Math.floor((rd - minDate) / 864e5) * dayW;
          const rColor = RELEASE_STATUS_COLORS[r.status] || '#8b5cf6';
          ctx.strokeStyle = rColor;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx, H); ctx.stroke();

          ctx.fillStyle = rColor;
          ctx.font = 'bold 8px var(--font-body)';
          ctx.textAlign = 'left';
          ctx.fillText(r.name, rx + 4, 12);
        }
      });

      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= filtered.length; i++) {
        const y = HEAD_H + i * ROW_H;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      const taskPositions = {};
      filtered.forEach((t, i) => {
        const s = new Date(t.startDate), e = new Date(t.dueDate);
        s.setHours(0, 0, 0, 0); e.setHours(0, 0, 0, 0);
        const x1 = PAD_L + Math.max(0, Math.floor((s - minDate) / 864e5)) * dayW;
        const x2 = PAD_L + Math.floor((e - minDate) / 864e5) * dayW + dayW;
        const y = HEAD_H + i * ROW_H + (ROW_H - BAR_H) / 2;
        const bw = Math.max(x2 - x1, dayW);

        hitAreas.push({ x: x1, x2: x1 + bw, y: HEAD_H + i * ROW_H, y2: HEAD_H + (i + 1) * ROW_H, item: t, idx: i });

        if (isFeat) {
          const bc = t.overdue > 0 ? '#ef4444' : FEAT_PALETTE[i % FEAT_PALETTE.length];
          ctx.fillStyle = bc + '25';
          if (ctx.roundRect) {
            ctx.beginPath();
            ctx.roundRect(x1, y, bw, BAR_H, 6);
            ctx.fill();
          } else {
            ctx.fillRect(x1, y, bw, BAR_H);
          }

          const pw = bw * ((t.progress || 0) / 100);
          if (pw > 0) {
            ctx.fillStyle = bc;
            if (ctx.roundRect) {
              ctx.beginPath();
              ctx.roundRect(x1, y, pw, BAR_H, 6);
              ctx.fill();
            } else {
              ctx.fillRect(x1, y, pw, BAR_H);
            }
          }

          ctx.strokeStyle = t.overdue > 0 ? '#ef4444' : bc;
          ctx.lineWidth = 1;
          if (ctx.roundRect) {
            ctx.beginPath();
            ctx.roundRect(x1, y, bw, BAR_H, 6);
            ctx.stroke();
          } else {
            ctx.strokeRect(x1, y, bw, BAR_H);
          }
        } else {
          const isMS = t.startDate === t.dueDate || t.category === 'Milestone';
          if (isMS) {
            const mx = x1 + dayW / 2;
            const my = y + BAR_H / 2;
            taskPositions[t.id] = { x: mx, x2: mx, y: my };
            ctx.fillStyle = ST_COLORS[t.status] || '#94a3b8';
            ctx.beginPath();
            ctx.moveTo(mx, my - 8);
            ctx.lineTo(mx + 8, my);
            ctx.lineTo(mx, my + 8);
            ctx.lineTo(mx - 8, my);
            ctx.closePath();
            ctx.fill();
          } else {
            taskPositions[t.id] = { x: x1, x2: x1 + bw, y: y + BAR_H / 2 };
            ctx.fillStyle = (ST_COLORS[t.status] || '#94a3b8') + '25';
            if (ctx.roundRect) {
              ctx.beginPath();
              ctx.roundRect(x1, y, bw, BAR_H, 4);
              ctx.fill();
            } else {
              ctx.fillRect(x1, y, bw, BAR_H);
            }

            const pw = bw * ((t.progress || 0) / 100);
            if (pw > 0) {
              ctx.fillStyle = ST_COLORS[t.status] || '#3b82f6';
              if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(x1, y, pw, BAR_H, 4);
                ctx.fill();
              } else {
                ctx.fillRect(x1, y, bw, BAR_H);
              }
            }

            ctx.strokeStyle = ST_COLORS[t.status] || '#94a3b8';
            ctx.lineWidth = 1;
            if (ctx.roundRect) {
              ctx.beginPath();
              ctx.roundRect(x1, y, bw, BAR_H, 4);
              ctx.stroke();
            } else {
              ctx.strokeRect(x1, y, bw, BAR_H);
            }

            if (showActuals && t.actCompletionDate) {
              const actD = new Date(t.actCompletionDate); actD.setHours(0,0,0,0);
              const actX = PAD_L + Math.floor((actD - minDate)/864e5) * dayW + dayW/2;
              ctx.fillStyle = '#22c55e';
              ctx.beginPath();
              ctx.arc(actX, y + BAR_H/2, 4, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
      });

      if (showDeps && !isFeat) {
        ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1.2; ctx.globalAlpha = .7;
        filtered.forEach(t => {
          const deps = Array.isArray(t.dependsOn) ? t.dependsOn : (t.dependsOn ? String(t.dependsOn).split(',').map(s => s.trim()).filter(Boolean) : []);
          deps.forEach(depId => {
            const from = taskPositions[depId], to = taskPositions[t.id];
            if (!from || !to) return;
            ctx.beginPath();
            ctx.moveTo(from.x2, from.y);
            ctx.lineTo(from.x2 + 8, from.y);
            ctx.lineTo(from.x2 + 8, to.y);
            ctx.lineTo(to.x, to.y);
            ctx.stroke();
            // Arrowhead
            ctx.beginPath();
            ctx.moveTo(to.x, to.y);
            ctx.lineTo(to.x - 5, to.y - 3);
            ctx.lineTo(to.x - 5, to.y + 3);
            ctx.closePath();
            ctx.fillStyle = '#f59e0b';
            ctx.fill();
          });
        });
        ctx.globalAlpha = 1;
      }
    }

    const leftScroll = leftPanel;
    const rightScroll = $id('export-gantt-right');
    rightScroll.addEventListener('scroll', () => {
      leftScroll.scrollTop = rightScroll.scrollTop;
    });
    leftScroll.addEventListener('wheel', (e) => {
      rightScroll.scrollTop += e.deltaY;
    }, { passive: true });

    // ─── Swimlane renderer ───────────────────────────────────────────────────
    let slHitAreas = [];

    function renderSwimlane() {
      updateMetricsAndLegend();
      const swimOuter = $id('export-swimlane-outer');
      swimOuter.innerHTML = `
        <div class="sl-left-col">
          <div class="sl-axis-left-header">Category / Item</div>
          <div class="sl-left-lanes-container"></div>
        </div>
        <div class="sl-splitter" id="export-sl-splitter"></div>
        <div class="sl-right-col">
          <div class="sl-axis-right-container">
            <canvas id="sl-axis-canvas"></canvas>
          </div>
          <div class="sl-right-lanes-container"></div>
        </div>
      `;
      slHitAreas = [];

      // Splitter dragging
      const slSplitter = swimOuter.querySelector('#export-sl-splitter');
      let isSlDragging = false;
      if (slSplitter) {
        slSplitter.addEventListener('mousedown', (e) => {
          isSlDragging = true;
          slSplitter.classList.add('dragging');
          document.body.style.cursor = 'col-resize';
          e.preventDefault();
        });
        document.addEventListener('mousemove', (e) => {
          if (!isSlDragging) return;
          const newWidth = Math.max(120, Math.min(600, e.clientX));
          document.documentElement.style.setProperty('--sl-left-w', newWidth + 'px');
        });
        document.addEventListener('mouseup', () => {
          if (isSlDragging) {
            isSlDragging = false;
            slSplitter.classList.remove('dragging');
            document.body.style.cursor = '';
          }
        });
      }

      // Sync scrolling
      const leftCol = swimOuter.querySelector('.sl-left-col');
      const rightCol = swimOuter.querySelector('.sl-right-col');
      if (leftCol && rightCol) {
        rightCol.addEventListener('scroll', () => {
          leftCol.scrollTop = rightCol.scrollTop;
        });
        leftCol.addEventListener('wheel', (e) => {
          rightCol.scrollTop += e.deltaY;
        }, { passive: true });
      }

      const q = searchQuery;
      const filtered = items.filter(t => !q || t.name.toLowerCase().includes(q) || (t.release || '').toLowerCase().includes(q) || (t.category || '').toLowerCase().includes(q));

      // Compute date range
      const allDates = filtered.flatMap(t => [t.startDate, t.dueDate]).filter(Boolean).map(d => new Date(d + 'T00:00:00'));
      if (allDates.length === 0) {
        swimOuter.innerHTML = '<div style="padding:24px; font-size:12px; color:var(--color-text-muted); text-align:center;">No items to display.</div>';
        return;
      }

      let minDate = new Date(Math.min(...allDates));
      let maxDate = new Date(Math.max(...allDates));

      // Snap to boundaries
      const z = currentZoom;
      if (z === 'week') {
        const dow = minDate.getDay(); minDate.setDate(minDate.getDate() - (dow === 0 ? 6 : dow - 1));
        const dowE = maxDate.getDay(); maxDate.setDate(maxDate.getDate() + (dowE === 0 ? 0 : 7 - dowE));
      } else if (z === 'month') {
        minDate = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
        maxDate = new Date(maxDate.getFullYear(), maxDate.getMonth() + 1, 0);
      }

      const totalMs = maxDate - minDate;

      // Group items
      const groupMap = new Map();
      filtered.forEach(t => {
        const key = getGroupKey(t);
        if (!groupMap.has(key)) groupMap.set(key, []);
        groupMap.get(key).push(t);
      });

      // Axis canvas sizing and drawing
      const dayW = currentZoom === 'day' ? 30 : currentZoom === 'week' ? 14 : 4;
      const totalDays = Math.ceil(totalMs / 864e5) + 1;
      const W = totalDays * dayW + 24;
      const dpr = window.devicePixelRatio || 1;

      const axisCvs = $id('sl-axis-canvas');
      axisCvs.width = W * dpr;
      axisCvs.height = 36 * dpr;
      axisCvs.style.width = W + 'px';
      axisCvs.style.height = '36px';

      drawSwimlaneAxis(axisCvs, dpr, minDate, maxDate, W, 36);

      const leftContainer = swimOuter.querySelector('.sl-left-lanes-container');
      const rightContainer = swimOuter.querySelector('.sl-right-lanes-container');

      if (!window._collapsedLanes) window._collapsedLanes = new Set();

      const sortedKeys = Array.from(groupMap.keys()).sort((a, b) => {
        if (a === 'Uncategorized' || a === 'General') return 1;
        if (b === 'Uncategorized' || b === 'General') return -1;
        return a.localeCompare(b);
      });

      let laneIdx = 0;
      sortedKeys.forEach(laneKey => {
        const laneItems = groupMap.get(laneKey);
        const lc = laneColorForIdx(laneIdx);
        const progress = laneItems.length > 0 ? Math.round(laneItems.reduce((s, t) => s + (t.progress || 0), 0) / laneItems.length) : 0;
        const laneMin = new Date(Math.min(...laneItems.map(t => t.startDate ? new Date(t.startDate + 'T00:00:00') : Infinity)));
        const laneMax = new Date(Math.max(...laneItems.map(t => t.dueDate ? new Date(t.dueDate + 'T00:00:00') : -Infinity)));

        const isCollapsed = window._collapsedLanes.has(laneKey);

        // Create left group
        const leftGrp = document.createElement('div');
        leftGrp.className = 'sl-lane-left-group' + (isCollapsed ? ' collapsed' : '');
        leftGrp.setAttribute('data-lane-key', laneKey);

        const leftHeader = document.createElement('div');
        leftHeader.className = 'sl-left-lane-header';
        leftHeader.style.background = `linear-gradient(135deg, ${lc}12 0%, ${lc}04 100%)`;
        leftHeader.innerHTML = `
          <span class="sl-collapse-icon" style="margin-right:4px; font-size:9px; transition:transform 0.2s ease; display:inline-block; color:var(--color-text-muted)">▼</span>
          <div class="sl-lane-accent" style="background:${lc}"></div>
          <div class="sl-lane-title">${esc(laneKey)}</div>
          <div class="sl-lane-count" style="background:${lc}18; border:1px solid ${lc}33; color:${lc}">${laneItems.length} item${laneItems.length!==1?'s':''}</div>
        `;

        const itemsList = document.createElement('div');
        itemsList.className = 'sl-left-items-list';

        laneItems.forEach((t, i) => {
          const itemEl = document.createElement('div');
          itemEl.className = 'sl-left-item';
          itemEl.style.height = isFeat ? '48px' : '32px';
          
          let statusC = '#f59e0b';
          if (t.overdue > 0) statusC = '#ef4444';
          else if (t.progress === 100) statusC = '#10b981';
          else if (t.progress > 0) statusC = '#3b82f6';

          itemEl.innerHTML = `
            <div style="width:6px; height:6px; border-radius:50%; background:${statusC}; margin-right:8px; flex-shrink:0;"></div>
            <div style="flex:1; min-width:0; overflow:hidden;">
              <div class="export-item-name" style="font-weight:700; font-size:11.5px; color:var(--color-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.2;">${esc(t.name)}</div>
              <div style="font-size:9px; color:var(--color-text-muted); font-weight:600; margin-top:2px;">${t.progress || 0}% maturity • ${t.release || 'Unassigned'}</div>
            </div>
          `;
          itemsList.appendChild(itemEl);
        });

        leftGrp.appendChild(leftHeader);
        leftGrp.appendChild(itemsList);
        leftContainer.appendChild(leftGrp);

        // Create right group
        const rightGrp = document.createElement('div');
        rightGrp.className = 'sl-lane-right-group' + (isCollapsed ? ' collapsed' : '');
        rightGrp.setAttribute('data-lane-key', laneKey);

        const rightHeader = document.createElement('div');
        rightHeader.style.height = '36px';
        rightHeader.style.background = `linear-gradient(135deg, ${lc}12 0%, ${lc}04 100%)`;
        rightHeader.style.borderBottom = '1px solid var(--color-divider)';
        rightGrp.appendChild(rightHeader);

        const canvasWrap = document.createElement('div');
        canvasWrap.className = 'sl-lane-canvas-wrap';

        const rowH = isFeat ? 48 : 32;
        const canvasH = laneItems.length * rowH;

        const cvs = document.createElement('canvas');
        cvs.width = W * dpr;
        cvs.height = canvasH * dpr;
        cvs.style.width = W + 'px';
        cvs.style.height = canvasH + 'px';
        canvasWrap.appendChild(cvs);
        rightGrp.appendChild(canvasWrap);
        rightContainer.appendChild(rightGrp);

        // Draw Canvas content
        const barH = isFeat ? 20 : 16;
        drawSwimlaneCanvas(cvs, dpr, laneItems, lc, minDate, maxDate, W, canvasH, rowH, barH);

        // Connect Collapse Click
        leftHeader.onclick = () => {
          if (window._collapsedLanes.has(laneKey)) {
            window._collapsedLanes.delete(laneKey);
            leftGrp.classList.remove('collapsed');
            rightGrp.classList.remove('collapsed');
          } else {
            window._collapsedLanes.add(laneKey);
            leftGrp.classList.add('collapsed');
            rightGrp.classList.add('collapsed');
          }
        };

        laneIdx++;
      });

      // Synchronize tooltips
      const slTooltip = $id('export-gantt-tooltip');
      swimOuter.addEventListener('mousemove', (e) => {
        let hit = null;
        for (const h of slHitAreas) {
          const rect = h.cvs.getBoundingClientRect();
          const mx = e.clientX - rect.left;
          const my = e.clientY - rect.top;
          if (mx >= h.x && mx <= h.x2 && my >= h.y && my <= h.y2 && h.cvs.offsetParent !== null) {
            hit = h;
            break;
          }
        }
        if (hit) {
          const t = hit.item;
          slTooltip.style.opacity = '1';
          slTooltip.style.transform = 'translateY(0)';
          let tx = e.clientX + 15, ty = e.clientY + 15;
          if (tx + 240 > window.innerWidth) tx = e.clientX - 255;
          if (ty + 160 > window.innerHeight) ty = e.clientY - 175;
          slTooltip.style.left = tx + 'px';
          slTooltip.style.top = ty + 'px';
          if (isFeat) {
            slTooltip.innerHTML = `
              <div style="font-weight:700;margin-bottom:8px;font-size:12px">${esc(t.name)}</div>
              <div style="display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:10px;color:var(--color-text-muted)">
                <span>Release:</span> <span style="color:var(--color-text);font-weight:600">${esc(t.release||'Unassigned')}</span>
                ${t.category ? `<span>Category:</span> <span style="color:#7c3aed;font-weight:600">${esc(t.category)}</span>` : ''}
                <span>Planned:</span> <span style="color:var(--color-text);font-weight:600">${fmtDateFull(t.startDate)} &rarr; ${fmtDateFull(t.dueDate)}</span>
                <span>Progress:</span> <span style="color:var(--color-text);font-weight:600">${t.progress||0}%</span>
                <span>Screens:</span> <span style="color:var(--color-text);font-weight:600">${t.screensDone||0} / ${t.screensCount||0} done</span>
              </div>
            `;
          } else {
            slTooltip.innerHTML = `
              <div style="font-weight:700;margin-bottom:8px;font-size:12px">${esc(t.name)}</div>
              <div style="display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:10px;color:var(--color-text-muted)">
                <span>Status:</span> <span style="color:var(--color-text);font-weight:600">${esc(t.status)}</span>
                <span>Assignee:</span> <span style="color:var(--color-text);font-weight:600">${esc(t.assignee||'—')}</span>
                <span>Planned:</span> <span style="color:var(--color-text);font-weight:600">${fmtDateFull(t.startDate)} &rarr; ${fmtDateFull(t.dueDate)}</span>
                <span>Progress:</span> <span style="color:var(--color-text);font-weight:600">${t.progress||0}%</span>
              </div>
            `;
          }
          hit.cvs.style.cursor = 'pointer';
        } else {
          slTooltip.style.opacity = '0';
          slTooltip.style.transform = 'translateY(8px)';
          document.querySelectorAll('.sl-lane-canvas-wrap canvas').forEach(c => c.style.cursor = 'default');
        }
      });

      swimOuter.addEventListener('mouseleave', () => {
        slTooltip.style.opacity = '0';
        slTooltip.style.transform = 'translateY(8px)';
      });
    }

    function drawSwimlaneAxis(cvs, dpr, minDate, maxDate, W, H) {
      const ctx = cvs.getContext('2d');
      ctx.scale(dpr, dpr);

      const colors = getThemeColors();
      const totalMs = maxDate - minDate;

      function dateToX(d) {
        if (!d) return 12;
        const dt = new Date(d + 'T00:00:00');
        const drawW = W - 24;
        return 12 + Math.max(0, Math.min(drawW, ((dt - minDate) / totalMs) * drawW));
      }

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = colors.bg2;
      ctx.fillRect(0, 0, W, H);

      let tickCursor = new Date(minDate);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      while (tickCursor <= maxDate) {
        const tx = dateToX(tickCursor.toISOString().slice(0, 10));
        
        ctx.strokeStyle = colors.divider;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(tx, 0);
        ctx.lineTo(tx, H);
        ctx.stroke();

        let label = '';
        const z = currentZoom;
        if (z === 'day') {
          label = tickCursor.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
          tickCursor.setDate(tickCursor.getDate() + 1);
        } else if (z === 'week') {
          label = 'W' + Math.ceil(tickCursor.getDate() / 7) + ' ' + tickCursor.toLocaleDateString('en-GB', { month: 'short' });
          tickCursor.setDate(tickCursor.getDate() + 7);
        } else {
          label = tickCursor.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
          tickCursor.setMonth(tickCursor.getMonth() + 1);
        }

        ctx.fillStyle = colors.muted;
        ctx.font = '500 8.5px var(--font-body), sans-serif';
        ctx.fillText(label, tx, H / 2);
      }

      // Today line tag
      const today = new Date();
      today.setHours(0,0,0,0);
      if (today >= minDate && today <= maxDate) {
        const tx = dateToX(today.toISOString().slice(0, 10));
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.45)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(tx, 0);
        ctx.lineTo(tx, H);
        ctx.stroke();

        ctx.fillStyle = 'rgba(239, 68, 68, 0.85)';
        ctx.font = 'bold 8px var(--font-body), sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('TODAY', tx + 4, H / 2);
      }
    }

    function drawSwimlaneCanvas(cvs, dpr, laneItems, lc, minDate, maxDate, W, H, ROW_H, BAR_H) {
      const ctx = cvs.getContext('2d');
      ctx.scale(dpr, dpr);

      const colors = getThemeColors();
      const totalMs = maxDate - minDate;

      function dateToX(d) {
        if (!d) return 12;
        const dt = new Date(d + 'T00:00:00');
        const drawW = W - 24;
        return 12 + Math.max(0, Math.min(drawW, ((dt - minDate) / totalMs) * drawW));
      }

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, W, H);

      // Shaded release backgrounds
      const sortedRels = (DATA.releases || [])
        .filter(r => r.date)
        .map(r => ({ ...r, parsedDate: new Date(r.date + 'T00:00:00') }))
        .sort((a, b) => a.parsedDate - b.parsedDate);
      let lastX = 0;
      sortedRels.forEach(rel => {
        let rx = dateToX(rel.date);
        if (rx > W) rx = W;
        if (rx > lastX) {
          const baseColor = RELEASE_STATUS_COLORS[rel.status] || '#94a3b8';
          let rgbaColor = 'rgba(148, 163, 184, 0.05)';
          if (baseColor.startsWith('#')) {
            const r = parseInt(baseColor.slice(1, 3), 16);
            const g = parseInt(baseColor.slice(3, 5), 16);
            const b = parseInt(baseColor.slice(5, 7), 16);
            rgbaColor = `rgba(${r}, ${g}, ${b}, 0.05)`;
          }
          ctx.fillStyle = rgbaColor;
          ctx.fillRect(lastX, 0, rx - lastX, H);
        }
        lastX = Math.max(0, rx);
      });

      // Release vertical separator lines
      (DATA.releases || []).forEach(rel => {
        if (!rel.date) return;
        const rd = new Date(rel.date);
        rd.setHours(0, 0, 0, 0);
        if (rd < minDate || rd > maxDate) return;
        const rx = dateToX(rel.date);
        const relC = RELEASE_STATUS_COLORS[rel.status] || '#94a3b8';

        ctx.save();
        ctx.strokeStyle = relC;
        ctx.lineWidth   = 1;
        ctx.globalAlpha = 0.25;
        ctx.beginPath();
        ctx.moveTo(rx, 0);
        ctx.lineTo(rx, H);
        ctx.stroke();
        ctx.restore();
      });

      // Grid lines
      let tickCursor = new Date(minDate);
      while (tickCursor <= maxDate) {
        const tx = dateToX(tickCursor.toISOString().slice(0, 10));
        ctx.strokeStyle = colors.divider;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(tx, 0);
        ctx.lineTo(tx, H);
        ctx.stroke();

        const z = currentZoom;
        if (z === 'day') {
          tickCursor.setDate(tickCursor.getDate() + 1);
        } else if (z === 'week') {
          tickCursor.setDate(tickCursor.getDate() + 7);
        } else {
          tickCursor.setMonth(tickCursor.getMonth() + 1);
        }
      }

      // Today line
      const today = new Date();
      today.setHours(0,0,0,0);
      if (today >= minDate && today <= maxDate) {
        const tx = dateToX(today.toISOString().slice(0, 10));
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.45)';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(tx, 0);
        ctx.lineTo(tx, H);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Draw rows
      laneItems.forEach((t, i) => {
        const ry = i * ROW_H;
        const by = ry + (ROW_H - BAR_H) / 2;

        // Alternating row background
        if (i % 2 === 1) {
          ctx.fillStyle = isDarkTheme ? 'rgba(255, 255, 255, 0.012)' : 'rgba(0, 0, 0, 0.012)';
          ctx.fillRect(0, ry, W, ROW_H);
        }

        // Row border
        ctx.strokeStyle = colors.divider;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(0, ry + ROW_H);
        ctx.lineTo(W, ry + ROW_H);
        ctx.stroke();

        if (!t.startDate || !t.dueDate) {
          // Unscheduled placeholder
          const phW = 150;
          ctx.strokeStyle = isDarkTheme ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.08)';
          ctx.lineWidth = 1.2;
          ctx.setLineDash([4, 3]);
          ctx.fillStyle = isDarkTheme ? 'rgba(255, 255, 255, 0.015)' : 'rgba(0, 0, 0, 0.015)';
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(16, by, phW, BAR_H, 6);
          else ctx.rect(16, by, phW, BAR_H);
          ctx.fill();
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.fillStyle = colors.faint;
          ctx.font = 'italic 8.5px var(--font-body), sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Not scheduled', 16 + phW / 2, by + BAR_H / 2 + 3);
          
          slHitAreas.push({ cvs, x: 16, x2: 16 + phW, y: by, y2: by + BAR_H, item: t });
          return;
        }

        const x1 = dateToX(t.startDate);
        const x2 = dateToX(t.dueDate);
        const bw = Math.max(16, x2 - x1);

        // Progress gradient bar
        ctx.fillStyle = lc + '15';
        ctx.strokeStyle = lc + '33';
        ctx.lineWidth = 1;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x1, by, bw, BAR_H, 6);
        else ctx.rect(x1, by, bw, BAR_H);
        ctx.fill();
        ctx.stroke();

        const pct = t.progress || 0;
        if (pct > 0) {
          const barGrad = ctx.createLinearGradient(x1, by, x1 + bw * (pct / 100), by);
          barGrad.addColorStop(0, lc + 'dd');
          barGrad.addColorStop(1, lc);
          ctx.fillStyle = barGrad;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(x1, by, bw * (pct / 100), BAR_H, 6);
          else ctx.rect(x1, by, bw * (pct / 100), BAR_H);
          ctx.fill();
        }

        if (bw > 45) {
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 9.5px var(--font-mono), monospace';
          ctx.textAlign = 'center';
          ctx.fillText(pct + '%', x1 + bw / 2, by + BAR_H / 2 + 3.5);
        }

        slHitAreas.push({ cvs, x: x1, x2: x1 + bw, y: by, y2: by + BAR_H, item: t });
      });
    }

    async function copyViewImageToClipboard() {
      try {
        const btn = $id('copy-image-btn');
        if (btn) { btn.textContent = '⏳ Capturing…'; btn.disabled = true; }

        let finalCvs = document.createElement('canvas');
        const dpr = window.devicePixelRatio || 2;
        const colors = getThemeColors();

        // ── helpers ──────────────────────────────────────────────────────────
        function drawRR(ctx, x, y, w, h, r) {
          r = Math.min(r, w / 2, h / 2);
          if (ctx.roundRect) {
            ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
          } else {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath();
          }
        }

        function drawLeftRow(ctx, t, x, y, w, rowH, idx, isFeatureRow) {
          // Alternating row tint
          if (idx % 2 === 1) {
            ctx.fillStyle = isDarkTheme ? 'rgba(255,255,255,0.012)' : 'rgba(0,0,0,0.012)';
            ctx.fillRect(x, y, w, rowH);
          }

          if (isFeatureRow) {
            const healthC = t.overdue > 0 ? '#ef4444' : (t.progress || 0) >= 80 ? '#10b981' : (t.progress || 0) >= 40 ? '#6366f1' : '#f59e0b';
            const pct = t.progress || 0;

            // Left health accent stripe
            ctx.fillStyle = healthC;
            ctx.fillRect(x, y, 4, rowH);

            const px = x + 10;
            const availW = w - 14;

            // Name (bold, truncated)
            ctx.fillStyle = colors.text;
            ctx.font = '700 11.5px Plus Jakarta Sans, Outfit, sans-serif';
            ctx.textBaseline = 'alphabetic';
            const nameY = y + 17;
            ctx.save();
            ctx.beginPath(); ctx.rect(px, y, availW - 40, rowH); ctx.clip();
            ctx.fillText(t.name || '', px, nameY);
            ctx.restore();

            // Risk / Done badge (top-right)
            if (t.overdue > 0) {
              ctx.fillStyle = 'rgba(239,68,68,0.12)';
              drawRR(ctx, x + w - 36, y + 5, 34, 13, 5); ctx.fill();
              ctx.fillStyle = '#ef4444';
              ctx.font = '800 7.5px Plus Jakarta Sans, sans-serif';
              ctx.fillText('⚠ Risk', x + w - 33, y + 14.5);
            } else if (pct === 100) {
              ctx.fillStyle = 'rgba(16,185,129,0.12)';
              drawRR(ctx, x + w - 38, y + 5, 36, 13, 5); ctx.fill();
              ctx.fillStyle = '#10b981';
              ctx.font = '800 7.5px Plus Jakarta Sans, sans-serif';
              ctx.fillText('✓ Done', x + w - 35, y + 14.5);
            }

            // Second line: release + category + progress bar
            const metaY = y + 32;
            let bx = px;

            if (t.release) {
              const relText = '🚩 ' + (t.release.length > 9 ? t.release.substring(0, 8) + '…' : t.release);
              ctx.fillStyle = 'rgba(99,102,241,0.1)';
              drawRR(ctx, bx, metaY - 8, 56, 12, 4); ctx.fill();
              ctx.fillStyle = 'rgba(99,102,241,0.9)';
              ctx.font = '700 7.5px Plus Jakarta Sans, sans-serif';
              ctx.fillText(relText, bx + 3, metaY);
              bx += 60;
            }

            if (t.category && bx + 52 < x + w - 45) {
              const catText = '# ' + (t.category.length > 7 ? t.category.substring(0, 6) + '…' : t.category);
              ctx.fillStyle = 'rgba(124,58,237,0.08)';
              drawRR(ctx, bx, metaY - 8, 50, 12, 4); ctx.fill();
              ctx.fillStyle = '#7c3aed';
              ctx.font = '700 7.5px Plus Jakarta Sans, sans-serif';
              ctx.fillText(catText, bx + 3, metaY);
              bx += 54;
            }

            // Mini progress bar
            const barX = bx + 2;
            const barMaxW = Math.min(x + w - barX - 28, 70);
            if (barMaxW > 14) {
              ctx.fillStyle = isDarkTheme ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.07)';
              drawRR(ctx, barX, metaY - 4, barMaxW, 4, 2); ctx.fill();
              if (pct > 0) {
                ctx.fillStyle = healthC;
                drawRR(ctx, barX, metaY - 4, barMaxW * (pct / 100), 4, 2); ctx.fill();
              }
              ctx.fillStyle = healthC;
              ctx.font = '700 7.5px Plus Jakarta Sans, sans-serif';
              ctx.fillText(pct + '%', barX + barMaxW + 3, metaY);
            }

          } else {
            const isMS = t.startDate === t.dueDate || t.category === 'Milestone';
            const statusC = ST_COLORS[t.status] || '#94a3b8';
            const dotX = x + 14;
            const dotY = y + rowH / 2;
            ctx.fillStyle = statusC;
            ctx.beginPath(); ctx.arc(dotX, dotY, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = colors.text;
            ctx.font = '600 11px Plus Jakarta Sans, Outfit, sans-serif';
            ctx.textBaseline = 'middle';
            ctx.save();
            ctx.beginPath(); ctx.rect(dotX + 10, y, w - dotX - 12, rowH); ctx.clip();
            ctx.fillText(isMS ? '💎 ' + t.name : t.name, dotX + 10, dotY);
            ctx.restore();
          }

          // Row bottom divider
          ctx.strokeStyle = colors.divider;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(x, y + rowH); ctx.lineTo(x + w, y + rowH); ctx.stroke();
        }

        if (currentViewMode === 'timeline') {
          const leftEl = $id('export-gantt-left');
          const rightCvs = $id('export-gantt-canvas');
          if (!leftEl || !rightCvs) { if (btn) { btn.textContent = '📷 Copy Image'; btn.disabled = false; } return; }

          const leftW = leftEl.offsetWidth;
          const rightW = rightCvs.offsetWidth || (rightCvs.width / dpr);
          const totalW = leftW + rightW;
          const totalH = rightCvs.offsetHeight || (rightCvs.height / dpr);

          finalCvs.width = Math.round(totalW * dpr);
          finalCvs.height = Math.round(totalH * dpr);
          finalCvs.style.width = totalW + 'px';
          finalCvs.style.height = totalH + 'px';

          const fCtx = finalCvs.getContext('2d');
          fCtx.scale(dpr, dpr);

          fCtx.fillStyle = colors.bg;
          fCtx.fillRect(0, 0, totalW, totalH);

          const headH = isFeat ? 56 : 48;
          fCtx.fillStyle = colors.bg2;
          fCtx.fillRect(0, 0, leftW, headH);
          fCtx.fillStyle = colors.muted;
          fCtx.font = '800 10px Plus Jakarta Sans, sans-serif';
          fCtx.textBaseline = 'middle';
          fCtx.textAlign = 'left';
          fCtx.fillText((isFeat ? 'FEATURE / RELEASE' : 'TASK'), 16, headH / 2);
          fCtx.strokeStyle = colors.border;
          fCtx.lineWidth = 2;
          fCtx.beginPath(); fCtx.moveTo(0, headH); fCtx.lineTo(leftW, headH); fCtx.stroke();

          const rowH = isFeat ? 48 : 32;
          const rows = leftEl.querySelectorAll('.gl-row');
          rows.forEach((r, idx) => {
            const y = headH + idx * rowH;
            const nameEl = r.querySelector('.export-item-name');
            const nameText = nameEl ? nameEl.textContent.trim() : '';
            const t = items.find(it => it.name === nameText) || { name: nameText, progress: 0, overdue: 0 };
            drawLeftRow(fCtx, t, 0, y, leftW, rowH, idx, isFeat);
          });

          // Draw right canvas (scaled correctly for dpr)
          fCtx.drawImage(rightCvs, 0, 0, rightCvs.width, rightCvs.height, leftW, 0, rightCvs.width / dpr, rightCvs.height / dpr);

          fCtx.strokeStyle = colors.border;
          fCtx.lineWidth = 1;
          fCtx.beginPath(); fCtx.moveTo(leftW, 0); fCtx.lineTo(leftW, totalH); fCtx.stroke();

        } else {
          const leftCol = document.querySelector('.sl-left-col');
          const rightCol = document.querySelector('.sl-right-col');
          const axisCvs = $id('sl-axis-canvas');
          if (!leftCol || !rightCol || !axisCvs) { if (btn) { btn.textContent = '📷 Copy Image'; btn.disabled = false; } return; }

          const leftW = leftCol.offsetWidth;
          const rightW = axisCvs.width / dpr;
          const totalW = leftW + rightW;
          const axisH = 36;

          // Measure total height
          const leftLanes = leftCol.querySelectorAll('.sl-lane-left-group');
          const rightLanes = rightCol.querySelectorAll('.sl-lane-right-group');
          let totalH = axisH;
          leftLanes.forEach(lg => { totalH += lg.scrollHeight; });

          finalCvs.width = Math.round(totalW * dpr);
          finalCvs.height = Math.round(totalH * dpr);
          finalCvs.style.width = totalW + 'px';
          finalCvs.style.height = totalH + 'px';

          const fCtx = finalCvs.getContext('2d');
          fCtx.scale(dpr, dpr);

          fCtx.fillStyle = colors.bg;
          fCtx.fillRect(0, 0, totalW, totalH);

          // Axis header
          fCtx.fillStyle = colors.bg2;
          fCtx.fillRect(0, 0, leftW, axisH);
          fCtx.fillStyle = colors.muted;
          fCtx.font = '800 10px Plus Jakarta Sans, sans-serif';
          fCtx.textBaseline = 'middle';
          fCtx.textAlign = 'left';
          fCtx.fillText(isFeat ? 'CATEGORY / FEATURE' : 'MODULE / TASK', 16, axisH / 2);
          fCtx.strokeStyle = colors.border;
          fCtx.lineWidth = 2;
          fCtx.beginPath(); fCtx.moveTo(0, axisH); fCtx.lineTo(leftW, axisH); fCtx.stroke();
          fCtx.drawImage(axisCvs, 0, 0, axisCvs.width, axisCvs.height, leftW, 0, axisCvs.width / dpr, axisCvs.height / dpr);

          let currentY = axisH;

          leftLanes.forEach((laneLeftGrp, idx) => {
            const laneRightGrp = rightLanes[idx];
            if (!laneLeftGrp) return;

            const headerEl = laneLeftGrp.querySelector('.sl-left-lane-header');
            const hH = headerEl ? headerEl.offsetHeight : 36;

            // Lane header (left)
            fCtx.fillStyle = isDarkTheme ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)';
            fCtx.fillRect(0, currentY, leftW, hH);
            const accentEl = headerEl ? headerEl.querySelector('.sl-lane-accent') : null;
            if (accentEl) {
              fCtx.fillStyle = accentEl.style.background || '#6366f1';
              fCtx.fillRect(0, currentY, 3, hH);
            }
            const titleEl = headerEl ? headerEl.querySelector('.sl-lane-title') : null;
            fCtx.fillStyle = colors.text;
            fCtx.font = 'bold 12px Plus Jakarta Sans, sans-serif';
            fCtx.textBaseline = 'middle';
            fCtx.textAlign = 'left';
            fCtx.fillText(titleEl ? titleEl.textContent.trim() : '', 14, currentY + hH / 2);

            // Lane header (right)
            fCtx.fillStyle = isDarkTheme ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.025)';
            fCtx.fillRect(leftW, currentY, rightW, hH);
            fCtx.strokeStyle = colors.divider;
            fCtx.lineWidth = 0.5;
            fCtx.beginPath(); fCtx.moveTo(0, currentY + hH); fCtx.lineTo(totalW, currentY + hH); fCtx.stroke();

            currentY += hH;

            if (!laneLeftGrp.classList.contains('collapsed')) {
              const itemEls = laneLeftGrp.querySelectorAll('.sl-left-item');
              const canvasEl = laneRightGrp ? laneRightGrp.querySelector('canvas') : null;
              const rowH = isFeat ? 48 : 32;
              const itemStartY = currentY;

              itemEls.forEach((itemEl, i) => {
                const nameEl = itemEl.querySelector('.export-item-name');
                const nameText = nameEl ? nameEl.textContent.trim() : '';
                const t = items.find(it => it.name === nameText) || { name: nameText, progress: 0, overdue: 0 };
                drawLeftRow(fCtx, t, 0, currentY, leftW, rowH, i, isFeat);
                currentY += rowH;
              });

              if (canvasEl && canvasEl.width > 0 && canvasEl.height > 0) {
                fCtx.drawImage(canvasEl, 0, 0, canvasEl.width, canvasEl.height,
                  leftW, itemStartY, canvasEl.width / dpr, canvasEl.height / dpr);
              }
            }
          });

          fCtx.strokeStyle = colors.border;
          fCtx.lineWidth = 1;
          fCtx.beginPath(); fCtx.moveTo(leftW, 0); fCtx.lineTo(leftW, totalH); fCtx.stroke();
        }

        finalCvs.toBlob(async (blob) => {
          if (btn) { btn.textContent = '📷 Copy Image'; btn.disabled = false; }
          if (!blob) return;
          try {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            if (btn) {
              btn.textContent = '✓ Copied!';
              setTimeout(() => { btn.textContent = '📷 Copy Image'; }, 2000);
            }
          } catch (err) {
            console.error('Clipboard copy failed:', err);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'timeline-export.png';
            a.click();
          }
        }, 'image/png');
      } catch (e) {
        console.error('Error generating capture image:', e);
        const btn = $id('copy-image-btn');
        if (btn) { btn.textContent = '📷 Copy Image'; btn.disabled = false; }
      }
    }

    renderGantt();
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
</body>
</html>
